services:
  agent-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imaginary-tree-agents
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./.env
    environment:
      APP_PLATFORM_API_BASE_URL: ${DOCKER_APP_PLATFORM_API_BASE_URL:-http://host.docker.internal:8000/api/v1}
      API_BASE_URL: ${DOCKER_APP_PLATFORM_API_BASE_URL:-http://host.docker.internal:8000/api/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./management/data:/app/agents/management/data
      - ./agents_scheduler/memory/data:/app/agents/agents_scheduler/memory/data
