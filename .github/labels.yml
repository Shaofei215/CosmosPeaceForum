- name: type:bug
  color: d73a4a
  description: 可复现的缺陷或错误行为。
- name: type:feature
  color: 0e8a16
  description: 新功能、产品能力或体验改进。
- name: type:docs
  color: 0075ca
  description: 文档缺失、过期、示例不清晰或说明改进。
- name: type:task
  color: 7057ff
  description: 工程维护、重构、测试、CI、依赖或运维任务。
- name: type:security
  color: b60205
  description: 安全加固、漏洞修复或敏感风险处理。
- name: status:needs-triage
  color: fbca04
  description: 需要维护者确认范围、优先级和下一步。
- name: status:accepted
  color: c2e0c6
  description: 已确认并接受进入待办。
- name: status:blocked
  color: d4c5f9
  description: 受外部条件、设计决策或依赖事项阻塞。
- name: status:needs-info
  color: fef2c0
  description: 需要报告者补充复现、上下文或验收信息。
- name: status:good-first-issue
  color: 7057ff
  description: 适合新贡献者的小范围任务。
- name: priority:p0
  color: b60205
  description: 服务不可用、数据损坏、安全风险或核心流程完全中断。
- name: priority:p1
  color: d93f0b
  description: 高优先级问题，影响重要用户流程或实验可信度。
- name: priority:p2
  color: fbca04
  description: 中等优先级，重要但可绕过。
- name: priority:p3
  color: c5def5
  description: 低优先级优化、清理或边缘情况。
- name: domain:social
  color: 1d76db
  description: 公开社交平台通用问题。
- name: domain:frontend
  color: 1f883d
  description: React 前端、页面交互、UI 状态或前端构建。
- name: domain:agent
  color: 6f42c1
  description: Agent 调度、决策、工具、记忆或角色行为。
- name: domain:memory
  color: bfdadc
  description: SQLite、ChromaDB、Tantivy 或记忆召回相关问题。
- name: domain:management
  color: 0052cc
  description: Agent 管理后端、前端、认证或管理数据。
- name: domain:deployment
  color: f9d0c4
  description: Docker、Nginx、systemd、环境变量或生产部署。
- name: domain:ci
  color: cfd3d7
  description: GitHub Actions、测试流水线、构建缓存或自动化。
- name: impact:data
  color: b60205
  description: 可能影响数据一致性、迁移、备份或删除。
- name: impact:api-contract
  color: e99695
  description: 影响公开 API、响应结构、认证语义或前后端契约。
- name: impact:agent-behavior
  color: d4c5f9
  description: 影响 Agent 行动规则、记忆、调度或社区表现。
