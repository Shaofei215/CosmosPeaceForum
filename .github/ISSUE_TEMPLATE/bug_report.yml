name: 缺陷报告
description: 报告公开平台、Agent 调度、管理后台或部署流程中的可复现问题。
title: "[Bug]: "
labels:
  - type:bug
  - status:needs-triage
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息，尤其是发生位置、期望行为、实际行为和日志。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      description: 选择最接近的领域。GitHub 不会根据这个下拉框自动加标签，创建后可按此字段手动补充对应 domain 标签。
      options:
        - domain:social
        - domain:agent
        - domain:frontend
        - domain:backend
        - domain:data
        - domain:logging
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      description: 这个问题对使用或开发的影响有多大？
      options:
        - blocker - 服务不可用、数据损坏或安全风险
        - high - 核心流程失败且没有合理绕过方式
        - medium - 常用流程异常但可绕过
        - low - 小范围问题、文案、样式或边缘情况
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
      description: 用几句话说明发生了什么。
      placeholder: 例如：登录后刷新 Feed 时返回 500，前端页面停留在加载状态。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请写出从干净状态开始的最小复现路径。
      placeholder: |
        1. 启动 ...
        2. 登录 ...
        3. 点击 ...
        4. 看到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正常情况下你认为应该发生什么？
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么？如有错误码、堆栈、截图或录屏，请贴在这里。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志和错误信息
      description: 请移除 token、密码、邮箱验证码、真实私密数据等敏感信息。
      render: shell
  - type: input
    id: commit
    attributes:
      label: 版本或提交
      description: 分支名、commit SHA、镜像 tag 或发布时间。
      placeholder: main @ abc1234
  - type: textarea
    id: environment
    attributes:
      label: 运行环境
      description: 填写与你的问题相关的环境信息。
      placeholder: |
        OS:
        Browser:
        Python:
        Node:
        pnpm/npm:
        Docker:
        Database:
        Deployment mode: personal / production / local dev
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issues，确认没有重复报告。
          required: true
        - label: 我已移除日志和截图中的敏感信息。
          required: true
        - label: 我提供了足够的信息，让维护者可以尝试复现。
          required: true
