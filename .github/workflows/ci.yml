name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-validation:
    name: ${{ matrix.check_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - check_name: Tests / Python / Unit
            test_marker: unit
          - check_name: Tests / Python / Integration
            test_marker: integration

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      API_V1_PREFIX: /api/v1
      DATABASE_URL: sqlite:////tmp/cosmos-peace-forum-social-platform-ci.db
      JWT_SECRET_KEY: ci-jwt-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_HOURS: "24"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_HOURS: "12"
      REMEMBER_ME_REFRESH_TOKEN_EXPIRE_DAYS: "30"
      ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES: "10"
      ADMIN_REFRESH_TOKEN_EXPIRE_HOURS: "8"
      ADMIN_REMEMBER_ME_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      AI_ACCESS_TOKEN_EXPIRE_HOURS: "24"
      AI_REFRESH_TOKEN_EXPIRE_HOURS: "24"
      ADMIN_KEY: ci-admin-key
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "465"
      SMTP_USER: ci@example.com
      SMTP_PASSWORD: ci-password
      SMTP_USE_SSL: "true"
      SMTP_SENDER_NAME: CosmosPeaceForum
      SMTP_SENDER_EMAIL: ci@example.com
      EMAIL_CODE_EXPIRE_MINUTES: "10"
      EMAIL_CODE_SEND_INTERVAL_MINUTES: "1"
      EMAIL_CODE_DAILY_LIMIT: "10"
      EMAIL_CODE_MAX_ATTEMPTS: "5"
      AVATAR_STORAGE_STRATEGY: local
      AVATAR_UPLOAD_DIR: /tmp/cosmos-peace-forum-social-platform-uploads
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: "8000"
      MANAGEMENT_SERVER_HOST: 127.0.0.1
      MANAGEMENT_SERVER_PORT: "8001"
      MANAGEMENT_DATABASE_URL: sqlite:////tmp/cosmos-peace-forum-management-ci.db
      MANAGEMENT_JWT_SECRET_KEY: ci-management-jwt-secret
      MANAGEMENT_JWT_ALGORITHM: HS256
      MANAGEMENT_ACCESS_TOKEN_EXPIRE_MINUTES: "10"
      MANAGEMENT_REFRESH_TOKEN_EXPIRE_HOURS: "8"
      MANAGEMENT_REMEMBER_ME_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MANAGEMENT_ADMIN_INITIAL_USERNAME: management_admin
      MANAGEMENT_ADMIN_INITIAL_PASSWORD: ChangeMe123!
      AI_USER_PASSWORD: ChangeMe123!
      SOCIAL_PLATFORM_API_BASE_URL: http://127.0.0.1:8000/api/v1
      SCHEDULER_INTERNAL_HOST: 127.0.0.1
      SCHEDULER_INTERNAL_PORT: "8002"
      LOG_LEVEL: INFO

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsqlite3-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -m "${{ matrix.test_marker }}"

  runtime-smoke:
    name: Smoke / Runtime Entrypoints
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: ${{ github.workspace }}
      PLATFORM_DISPLAY_NAME: CosmosPeaceForum CI
      PLATFORM_ENGLISH_NAME: Cosmos Peace Forum CI
      API_V1_PREFIX: /api/v1
      SOCIAL_PLATFORM_FRONTEND_URL: http://127.0.0.1:8000
      EXTERNAL_AGENT_API_BASE_URL: http://127.0.0.1:8001/external/v1
      DATABASE_URL: sqlite:////tmp/cosmos-peace-forum-social-platform-ci.db
      JWT_SECRET_KEY: ci-jwt-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_HOURS: "24"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_HOURS: "12"
      REMEMBER_ME_REFRESH_TOKEN_EXPIRE_DAYS: "30"
      ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES: "10"
      ADMIN_REFRESH_TOKEN_EXPIRE_HOURS: "8"
      ADMIN_REMEMBER_ME_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      AI_ACCESS_TOKEN_EXPIRE_HOURS: "24"
      AI_REFRESH_TOKEN_EXPIRE_HOURS: "24"
      ADMIN_KEY: ci-admin-key
      PLATFORM_ADMIN_INITIAL_USERNAME: platform_admin
      PLATFORM_ADMIN_INITIAL_PASSWORD: CiPlatformAdmin123!
      SMTP_HOST: smtp.example.com
      SMTP_PORT: "465"
      SMTP_USER: ci@example.com
      SMTP_PASSWORD: ci-password
      SMTP_USE_SSL: "true"
      SMTP_SENDER_NAME: CosmosPeaceForum
      SMTP_SENDER_EMAIL: ci@example.com
      EMAIL_CODE_EXPIRE_MINUTES: "10"
      EMAIL_CODE_SEND_INTERVAL_MINUTES: "1"
      EMAIL_CODE_DAILY_LIMIT: "10"
      EMAIL_CODE_MAX_ATTEMPTS: "5"
      INVITATION_REGISTRATION_ENABLED: "false"
      AVATAR_STORAGE_STRATEGY: local
      AVATAR_UPLOAD_DIR: /tmp/cosmos-peace-forum-social-platform-uploads
      MAX_AVATAR_SIZE: "5242880"
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: "8000"
      MANAGEMENT_SERVER_HOST: 127.0.0.1
      MANAGEMENT_SERVER_PORT: "8001"
      MANAGEMENT_DATABASE_URL: sqlite:////tmp/cosmos-peace-forum-management-ci.db
      MANAGEMENT_JWT_SECRET_KEY: ci-management-jwt-secret
      MANAGEMENT_JWT_ALGORITHM: HS256
      MANAGEMENT_ACCESS_TOKEN_EXPIRE_MINUTES: "10"
      MANAGEMENT_REFRESH_TOKEN_EXPIRE_HOURS: "8"
      MANAGEMENT_REMEMBER_ME_REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MANAGEMENT_ADMIN_INITIAL_USERNAME: agents_admin
      MANAGEMENT_ADMIN_INITIAL_PASSWORD: CiManagementAdmin123!
      AI_USER_PASSWORD: CiAgentUser123!
      SOCIAL_PLATFORM_API_BASE_URL: http://127.0.0.1:8000/api/v1
      SCHEDULER_INTERNAL_HOST: 127.0.0.1
      SCHEDULER_INTERNAL_PORT: "8002"
      LOG_LEVEL: INFO
      LOG_DIR: /tmp/cosmos-peace-forum-runtime-logs
      LOG_RETENTION_DAYS: "30"
      LOG_SEGMENT_MAX_MB: "50"
      LOG_MAX_TOTAL_MB: "512"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libsqlite3-dev

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Prepare public platform database
        run: python -m alembic -c social_platform/alembic.ini upgrade head

      - name: Smoke test public platform entrypoint
        run: |
          set -euo pipefail

          python -m social_platform --host 127.0.0.1 --port 8000 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT

          for _ in {1..45}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/openapi.json >/dev/null; then
              exit 0
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              wait "${server_pid}"
            fi
            sleep 1
          done

          echo "social_platform did not become ready in time" >&2
          exit 1

      - name: Smoke test agent console API entrypoint
        run: |
          set -euo pipefail

          uvicorn agents.management.backend.main:app --host 127.0.0.1 --port 8001 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT

          for _ in {1..45}; do
            if curl -fsS http://127.0.0.1:8001/openapi.json >/dev/null; then
              exit 0
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              wait "${server_pid}"
            fi
            sleep 1
          done

          echo "agent console API did not become ready in time" >&2
          exit 1

      - name: Smoke test agent scheduler entrypoint
        env:
          SCHEDULER_INTERNAL_PORT: "8012"
        run: |
          set -euo pipefail

          python -m agents.agents_scheduler &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT

          for _ in {1..45}; do
            if curl -fsS http://127.0.0.1:8012/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              wait "${server_pid}"
            fi
            sleep 1
          done

          echo "agent scheduler did not become ready in time" >&2
          exit 1

      - name: Smoke test combined agent services entrypoint
        env:
          MANAGEMENT_SERVER_PORT: "8011"
          SCHEDULER_INTERNAL_PORT: "8013"
        run: |
          set -euo pipefail

          python -m agents &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT

          for _ in {1..45}; do
            if curl -fsS http://127.0.0.1:8011/openapi.json >/dev/null \
              && curl -fsS http://127.0.0.1:8013/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              wait "${server_pid}"
            fi
            sleep 1
          done

          echo "combined agent services did not become ready in time" >&2
          exit 1

  web-quality:
    name: Quality / Web / ${{ matrix.product_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - product_name: Community
            working_directory: social_platform/frontend
            lockfile: social_platform/frontend/pnpm-lock.yaml
          - product_name: Agent Console
            working_directory: agents/management/frontend
            lockfile: agents/management/frontend/pnpm-lock.yaml

    env:
      HUSKY: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        working-directory: ${{ matrix.working_directory }}
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ${{ matrix.working_directory }}
        run: pnpm test:run

      - name: Lint
        working-directory: ${{ matrix.working_directory }}
        run: pnpm lint

      - name: Type-check
        working-directory: ${{ matrix.working_directory }}
        run: pnpm type-check

      - name: Build
        working-directory: ${{ matrix.working_directory }}
        run: pnpm build
