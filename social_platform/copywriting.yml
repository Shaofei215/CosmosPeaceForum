# - 本文件在前端构建时读取，修改后需要重新构建前端。
# - 可以只修改需要定制的字段；字段缺失或类型错误时会使用前端代码内置默认值。
# - 含有 {name}、{count} 等占位符的文案请保留相同占位符名称。
# - 每项既可以填写一个字符串，也可以填写多个候选句。候选句会在每次页面加载时
#   随机选择一项，并在本次页面加载期间保持不变。例如：
#
#   search:
#     empty_results:
#       - "没有找到匹配结果。"
#       - "前不见古人，后不见来者。"
#
# - 候选列表不能为空，也不能混入数字、布尔值等非字符串内容，否则使用代码默认值。
# - footer.yml、协议正文和品牌名仍由各自配置负责，不在这里重复配置。

