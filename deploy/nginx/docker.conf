## 限流键为空时 Nginx 不记账，因此只限制真正会改变状态的 HTTP 方法。
map $request_method $api_write_limit_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
    OPTIONS "";
}

## 认证尝试和邮件发送分别计数，避免暴力破解与邮件接口滥用。
map $uri $auth_attempt_limit_key {
    default "";
    ~^/api/v1/auth/(?:login|register(?:/verify)?|admin-agent-login|password-reset/confirm)$ $binary_remote_addr;
}

map $uri $email_code_limit_key {
    default "";
    ~^/api/v1/auth/(?:register|login|password-reset)/send-code$ $binary_remote_addr;
}

map $uri $search_limit_key {
    default "";
    ~^/api/v1/search(?:/|$) $binary_remote_addr;
}

## 根据受限接口给出可执行的退避时间，并维持外部 Agent 的错误协议。
map $uri $rate_limit_retry_after {
    default 1;
    ~^/api/v1/auth/(?:register|login|password-reset)/send-code$ 7;
    ~^/api/v1/auth/(?:login|register(?:/verify)?|admin-agent-login|password-reset/confirm)$ 2;
}

map $uri $rate_limit_response {
    default '{"detail":"请求过于频繁，请稍后重试"}';
    ~^/agent-api/v1/ '{"error_code":"RATE_LIMITED","message":"请求过于频繁，请稍后重试","meta":{"request_id":"$request_id"}}';
}

limit_req_zone $binary_remote_addr zone=public_api:10m rate=60r/s;
limit_req_zone $api_write_limit_key zone=api_write:10m rate=15r/s;
limit_req_zone $auth_attempt_limit_key zone=auth_attempt:10m rate=30r/m;
limit_req_zone $email_code_limit_key zone=email_code:10m rate=9r/m;
limit_req_zone $search_limit_key zone=search:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=external_agent:10m rate=15r/s;

server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /var/www/social_platform;
    index index.html;

    client_max_body_size 10m;

    location = /admin {
        return 404;
    }

    location ^~ /admin/ {
        return 404;
    }

    location = /management-login {
        try_files $uri /index.html;
    }

    location ^~ /api/v1/admin {
        return 404;
    }

    location = /api/v1/auth/internal-agent-login {
        return 404;
    }

    location /agent-api/v1/ {
        limit_req zone=external_agent burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://agent-scheduler:8001/external/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Cosmos-Agent-Source "";
        proxy_set_header X-Cosmos-Agent-Token "";
        client_max_body_size 256k;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=public_api burst=120 nodelay;
        limit_req zone=api_write burst=30 nodelay;
        limit_req zone=auth_attempt burst=15 nodelay;
        limit_req zone=email_code burst=6 nodelay;
        limit_req zone=search burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://social-platform:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Cosmos-Agent-Source "";
        proxy_set_header X-Cosmos-Agent-Token "";
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After $rate_limit_retry_after always;
        return 429 $rate_limit_response;
    }

    location /downloads/ {
        proxy_pass http://social-platform:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://social-platform:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
