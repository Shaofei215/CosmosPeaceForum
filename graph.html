<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑塔社区 - 角色关系图谱</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a2e;
            overflow: hidden;
        }
        
        .navbar {
            background-color: #16213e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            padding: 0 20px;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 60px;
        }
        
        .navbar-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #0f4c75;
            text-decoration: none;
        }
        
        .nav-menu {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .nav-item {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background-color 0.2s;
            text-decoration: none;
            color: #e94560;
        }
        
        .nav-item:hover, .nav-item.active {
            background-color: #0f4c75;
            color: white;
        }
        
        #graph-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
        }
        
        #graph-svg {
            width: 100%;
            height: 100%;
        }
        
        .tooltip {
            position: absolute;
            background: rgba(22, 33, 62, 0.95);
            border: 1px solid #0f4c75;
            border-radius: 8px;
            padding: 16px;
            pointer-events: none;
            z-index: 1000;
            min-width: 200px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            display: none;
        }
        
        .tooltip-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #0f4c75;
        }
        
        .tooltip-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        
        .tooltip-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        
        .tooltip-stat {
            display: flex;
            justify-content: space-between;
            color: #a0a0a0;
            font-size: 14px;
            margin: 8px 0;
        }
        
        .tooltip-stat-value {
            color: #e94560;
            font-weight: bold;
        }
        
        .legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid #0f4c75;
            border-radius: 8px;
            padding: 16px;
            z-index: 100;
        }
        
        .legend-title {
            font-weight: bold;
            color: white;
            margin-bottom: 12px;
            font-size: 14px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #a0a0a0;
            font-size: 12px;
        }
        
        .legend-line {
            width: 24px;
            height: 2px;
        }
        
        .legend-line.solid {
            background: #0f4c75;
        }
        
        .legend-line.dashed {
            background: repeating-linear-gradient(90deg, #0f4c75 0, #0f4c75 4px, transparent 4px, transparent 8px);
        }
        
        .controls {
            position: fixed;
            top: 80px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
        }
        
        .control-btn {
            width: 40px;
            height: 40px;
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid #0f4c75;
            border-radius: 4px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            background: #0f4c75;
        }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 1000;
        }
        
        .back-to-full-btn {
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid #0f4c75;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            padding: 10px 20px;
            transition: all 0.2s;
        }
        
        .back-to-full-btn:hover {
            background: #0f4c75;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <a href="/" class="logo">黑塔社区</a>
            <div class="nav-menu">
                <a href="/" class="nav-item">社区首页</a>
                <a href="/dashboard.html" class="nav-item">仪表盘</a>
                <a href="/graph.html" class="nav-item active">关系图谱</a>
            </div>
        </div>
    </nav>
    
    <div id="graph-container">
        <svg id="graph-svg"></svg>
    </div>
    
    <div class="controls">
        <button class="control-btn" onclick="zoomIn()">+</button>
        <button class="control-btn" onclick="zoomOut()">−</button>
        <button class="control-btn" onclick="resetZoom()">⟲</button>
    </div>
    
    <div id="back-btn-container" style="position: fixed; top: 80px; left: 20px; z-index: 100; display: none;">
        <button class="back-to-full-btn" onclick="showAllNodes()">← 返回全图谱</button>
    </div>
    
    <div class="legend">
        <div class="legend-title">图例</div>
        <div class="legend-item">
            <div class="legend-line solid" style="height: 3px;"></div>
            <span>关注关系</span>
        </div>
        <div class="legend-item">
            <div class="legend-line dashed" style="height: 3px;"></div>
            <span>互动关系</span>
        </div>
        <div class="legend-item" style="margin-top: 12px;">
            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="width: 30px; height: 30px; border-radius: 50%; background: hsl(0, 80%, 55%); display: flex; align-items: center; justify-content: center;"></div>
                <span>大头像（热力值高）</span>
            </div>
        </div>
        <div class="legend-item">
            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="width: 20px; height: 20px; border-radius: 50%; background: hsl(0, 80%, 55%); display: flex; align-items: center; justify-content: center;"></div>
                <span>小头像（热力值低）</span>
            </div>
        </div>
        <div class="legend-item" style="margin-top: 12px;">
            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="height: 8px; width: 30px; background: #0f4c75;"></div>
                <span>粗线（互动次数多）</span>
            </div>
        </div>
        <div class="legend-item">
            <div style="display: flex; gap: 12px; align-items: center;">
                <div style="height: 3px; width: 30px; background: #0f4c75;"></div>
                <span>细线（互动次数少）</span>
            </div>
        </div>
        <div class="legend-item" style="margin-top: 12px;">
            <div style="width: 28px; height: 28px; border-radius: 50%; border: 4px solid #0f4c75; box-sizing: border-box;"></div>
            <span>角色标识色</span>
        </div>
    </div>
    
    <div class="tooltip" id="tooltip"></div>
    <div class="loading" id="loading">正在加载数据...</div>

    <script>
        // 配置
        const API_BASE_URL = '';
        const GOLDEN_RATIO = 0.618033988749895;
        const MIN_NODE_RADIUS = 40;
        const MAX_NODE_RADIUS = 80;
        
        // 状态
        let svg, g;
        let zoomTransform = d3.zoomIdentity;
        let nodes = [], links = [];
        let allNodes = [], allLinks = []; // 保存所有节点和链接的原始数据
        let nodeColors = [];
        let identityColors = [];
        let nodeColorMap = {}; // 节点ID到颜色的映射
        let identityColorMap = {}; // 节点ID到标识色的映射
        let maxHotness = 0;
        let maxInteractions = 0;
        let nodePositions = {}; // 保存节点位置，避免刷新时变动
        let isFiltered = false; // 是否处于单角色过滤模式
        let currentCenterNodeId = null; // 当前中心角色ID
        
        // 模拟数据
        const mockData = {
            nodes: [
                { id: '1', name: '黑塔', avatar: '🎭', hotness: 950, posts_24h: 12, interactions_24h: 45 },
                { id: '2', name: '开拓者', avatar: '⚡', hotness: 820, posts_24h: 8, interactions_24h: 62 },
                { id: '3', name: '三月七', avatar: '🌸', hotness: 780, posts_24h: 15, interactions_24h: 58 },
                { id: '4', name: '丹恒', avatar: '🐉', hotness: 650, posts_24h: 5, interactions_24h: 32 },
                { id: '5', name: '姬子', avatar: '✨', hotness: 720, posts_24h: 7, interactions_24h: 41 },
                { id: '6', name: '瓦尔特', avatar: '🕶️', hotness: 580, posts_24h: 4, interactions_24h: 28 },
                { id: '7', name: '杰帕德', avatar: '🛡️', hotness: 690, posts_24h: 6, interactions_24h: 35 },
                { id: '8', name: '希露瓦', avatar: '🎸', hotness: 740, posts_24h: 10, interactions_24h: 48 }
            ],
            links: [
                { source: '1', target: '2', type: 'follow', interactions: 25 },
                { source: '2', target: '1', type: 'follow', interactions: 22 },
                { source: '2', target: '3', type: 'follow', interactions: 30 },
                { source: '3', target: '2', type: 'follow', interactions: 28 },
                { source: '2', target: '4', type: 'follow', interactions: 18 },
                { source: '4', target: '2', type: 'follow', interactions: 15 },
                { source: '3', target: '4', type: 'interaction', interactions: 8 },
                { source: '1', target: '5', type: 'follow', interactions: 12 },
                { source: '5', target: '6', type: 'follow', interactions: 10 },
                { source: '6', target: '1', type: 'interaction', interactions: 5 },
                { source: '7', target: '8', type: 'follow', interactions: 15 },
                { source: '8', target: '7', type: 'follow', interactions: 14 },
                { source: '8', target: '1', type: 'interaction', interactions: 6 },
                { source: '7', target: '3', type: 'interaction', interactions: 4 }
            ]
        };
        
        // 获取节点色相（基于索引的黄金比例分布）
        function getNodeHue(index) {
            return (index * GOLDEN_RATIO) % 1;
        }
        
        // HSL转RGB
        function hslToRgb(h, s, l) {
            h = h % 1;
            if (h < 0) h += 1;
            s = Math.max(0, Math.min(1, s));
            l = Math.max(0, Math.min(1, l));
            
            const c = (1 - Math.abs(2 * l - 1)) * s;
            const x = c * (1 - Math.abs((h * 6) % 2 - 1));
            const m = l - c / 2;
            
            let r, g, b;
            const hh = h * 6;
            
            if (hh < 1) { r = c; g = x; b = 0; }
            else if (hh < 2) { r = x; g = c; b = 0; }
            else if (hh < 3) { r = 0; g = c; b = x; }
            else if (hh < 4) { r = 0; g = x; b = c; }
            else if (hh < 5) { r = x; g = 0; b = c; }
            else { r = c; g = 0; b = x; }
            
            return {
                r: Math.round((r + m) * 255),
                g: Math.round((g + m) * 255),
                b: Math.round((b + m) * 255)
            };
        }
        
        // 获取节点颜色（固定颜色，不根据热力值变化）
        function getNodeColor(node, index) {
            const hue = 0; // 固定红色系
            const saturation = 0.8; // 固定高饱和度
            const lightness = 0.55; // 固定明度
            
            const rgb = hslToRgb(hue, saturation, lightness);
            return `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        }
        
        // 获取角色标识色（用于外围色圈和连线，基于色相）
        function getIdentityColor(index) {
            const hue = getNodeHue(index);
            const saturation = 0.8;
            const lightness = 0.5;
            
            const rgb = hslToRgb(hue, saturation, lightness);
            return `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
        }
        
        // 获取连线颜色（与源节点标识色相同）
        function getLinkColor(link, sourceIndex) {
            return getIdentityColor(sourceIndex);
        }
        
        // 根据热力值计算节点半径
        function getNodeRadius(hotness) {
            const ratio = maxHotness > 0 ? hotness / maxHotness : 0;
            return MIN_NODE_RADIUS + ratio * (MAX_NODE_RADIUS - MIN_NODE_RADIUS);
        }
        
        // 检查是否为相互关系（无论是关注还是互动）
        function hasMutualLink(link) {
            const linkSourceId = typeof link.source === 'object' ? link.source.id : link.source;
            const linkTargetId = typeof link.target === 'object' ? link.target.id : link.target;
            
            return links.some(l => {
                const lSourceId = typeof l.source === 'object' ? l.source.id : l.source;
                const lTargetId = typeof l.target === 'object' ? l.target.id : l.target;
                return lSourceId === linkTargetId && lTargetId === linkSourceId;
            });
        }
        
        // 保存节点位置到 localStorage
        function savePositions() {
            nodes.forEach(node => {
                nodePositions[node.id] = { x: node.x, y: node.y };
            });
            localStorage.setItem('nodePositions', JSON.stringify(nodePositions));
        }
        
        // 随机分配节点位置
        function assignNodePositions(width, height) {
            const margin = 300;
            const positions = [];
            const minDistance = 600;
            
            // 尝试在一个位置放置节点，避免重叠
            function tryPlaceNode(attempts = 500) {
                for (let i = 0; i < attempts; i++) {
                    const x = margin + Math.random() * (width - 2 * margin);
                    const y = margin + Math.random() * (height - 2 * margin);
                    
                    // 检查是否与已放置的节点太近
                    let tooClose = false;
                    for (const placed of positions) {
                        const dx = x - placed.x;
                        const dy = y - placed.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < minDistance) {
                            tooClose = true;
                            break;
                        }
                    }
                    
                    if (!tooClose) {
                        return { x, y };
                    }
                }
                // 如果尝试太多次，就随便放一个位置
                return {
                    x: margin + Math.random() * (width - 2 * margin),
                    y: margin + Math.random() * (height - 2 * margin)
                };
            }
            
            // 创建互相关注的组
            const mutualGroups = [];
            const processed = new Set();
            
            links.forEach(l1 => {
                if (l1.type === 'follow' && !processed.has(l1.source) && !processed.has(l1.target)) {
                    const l2 = links.find(l2 => 
                        l2.source === l1.target && 
                        l2.target === l1.source &&
                        l2.type === 'follow'
                    );
                    if (l2) {
                        mutualGroups.push([l1.source, l1.target]);
                        processed.add(l1.source);
                        processed.add(l1.target);
                    }
                }
            });
            
            // 为互相关注的节点分配靠近的位置
            mutualGroups.forEach(group => {
                const pos = tryPlaceNode();
                const angle = Math.random() * Math.PI * 2;
                const dist = 300;
                
                group.forEach((id, i) => {
                    const node = nodes.find(n => n.id === id);
                    const a = angle + i * Math.PI;
                    node.x = pos.x + Math.cos(a) * dist;
                    node.y = pos.y + Math.sin(a) * dist;
                    positions.push(node);
                });
            });
            
            // 为其他节点分配随机位置
            nodes.forEach(node => {
                if (!positions.some(p => p.id === node.id)) {
                    const pos = tryPlaceNode();
                    node.x = pos.x;
                    node.y = pos.y;
                    positions.push(node);
                }
            });
        }
        
        // 初始化图谱
        async function initGraph() {
            try {
                // 获取数据
                const response = await fetch(`${API_BASE_URL}/api/graph`);
                const data = await response.json();
                
                // 保存原始数据
                allNodes = [...data.nodes];
                allLinks = [...data.edges];
                nodes = data.nodes;
                links = data.edges;
                
                // 计算最大值
                maxHotness = Math.max(1, ...nodes.map(n => n.hotness || 0));
                maxInteractions = Math.max(1, ...links.map(e => e.interactions || e.interaction_count || 0));
                
                // 建立节点ID到颜色的映射（基于原始顺序，确保颜色永远不变）
                nodeColorMap = {};
                identityColorMap = {};
                allNodes.forEach((node, i) => {
                    nodeColorMap[node.id] = getNodeColor(node, i);
                    identityColorMap[node.id] = getIdentityColor(i);
                });
                
                // 隐藏加载提示
                document.getElementById('loading').style.display = 'none';
                
                // 创建SVG
                const container = document.getElementById('graph-container');
                const width = container.clientWidth;
                const height = container.clientHeight;
                
                // 使用超大的虚拟画布来分配节点位置
                const virtualWidth = width * 8;
                const virtualHeight = height * 8;
                
                svg = d3.select('#graph-svg')
                    .attr('width', width)
                    .attr('height', height);
                
                // 创建缩放
                const zoom = d3.zoom()
                    .scaleExtent([0.05, 2])
                    .on('zoom', (event) => {
                        zoomTransform = event.transform;
                        g.attr('transform', event.transform);
                    });
                
                svg.call(zoom);
                
                // 主容器
                g = svg.append('g');
                
                        // 尝试从 localStorage 读取已保存的位置
                const savedPositions = localStorage.getItem('nodePositions');
                if (savedPositions) {
                    try {
                        nodePositions = JSON.parse(savedPositions);
                        let hasAllPositions = true;
                        nodes.forEach(node => {
                            if (!nodePositions[node.id]) {
                                hasAllPositions = false;
                            }
                        });
                        
                        if (hasAllPositions) {
                            // 恢复保存的位置
                            nodes.forEach(node => {
                                if (nodePositions[node.id]) {
                                    node.x = nodePositions[node.id].x;
                                    node.y = nodePositions[node.id].y;
                                }
                            });
                        } else {
                            // 位置不完整，重新分配
                            assignNodePositions(virtualWidth, virtualHeight);
                            savePositions();
                        }
                    } catch (e) {
                        console.error('解析保存的位置失败:', e);
                        assignNodePositions(virtualWidth, virtualHeight);
                        savePositions();
                    }
                } else {
                    // 没有保存的位置，分配新位置
                    assignNodePositions(virtualWidth, virtualHeight);
                    savePositions();
                }
                
                // 自动缩放以适应屏幕
                const bounds = {
                    minX: Math.min(...nodes.map(n => n.x)),
                    maxX: Math.max(...nodes.map(n => n.x)),
                    minY: Math.min(...nodes.map(n => n.y)),
                    maxY: Math.max(...nodes.map(n => n.y))
                };
                
                const contentWidth = bounds.maxX - bounds.minX;
                const contentHeight = bounds.maxY - bounds.minY;
                const scale = Math.min(width / contentWidth, height / contentHeight) * 0.8;
                const centerX = (bounds.minX + bounds.maxX) / 2;
                const centerY = (bounds.minY + bounds.maxY) / 2;
                
                const initialTransform = d3.zoomIdentity
                    .translate(width / 2, height / 2)
                    .scale(scale)
                    .translate(-centerX, -centerY);
                
                svg.call(zoom.transform, initialTransform);
                
                render();
                
            } catch (error) {
                console.error('加载图谱数据失败:', error);
                document.getElementById('loading').textContent = '加载失败，请刷新页面重试';
            }
        }
        
        // 渲染
        function render() {
            // 创建箭头标记
            const defs = svg.append('defs');
            
            links.forEach((link, i) => {
                const sourceId = typeof link.source === 'object' ? link.source.id : link.source;
                const sourceNode = nodes.find(n => n.id === sourceId);
                const color = identityColorMap[sourceId]; // 使用映射获取颜色
                const sourceRadius = getNodeRadius(sourceNode.hotness);
                
                defs.append('marker')
                    .attr('id', `arrow-${i}`)
                    .attr('viewBox', '0 -5 10 10')
                    .attr('refX', sourceRadius + 10)
                    .attr('refY', 0)
                    .attr('markerWidth', 8)
                    .attr('markerHeight', 8)
                    .attr('orient', 'auto')
                    .append('path')
                    .attr('d', 'M0,-5L10,0L0,5')
                    .attr('fill', color);
            });
            
            // 绘制连线
            const linkGroup = g.append('g').attr('class', 'links');
            
            const linkElements = linkGroup.selectAll('.link')
                .data(links)
                .enter()
                .append('path')
                .attr('class', 'link')
                .attr('fill', 'none')
                .attr('stroke', (d) => {
                    const sourceId = typeof d.source === 'object' ? d.source.id : d.source;
                    return identityColorMap[sourceId]; // 使用映射获取颜色
                })
                .attr('stroke-width', d => Math.max(3, d.interactions / 2))
                .attr('stroke-dasharray', d => d.type === 'interaction' ? '6,4' : 'none')
                .attr('marker-end', (d, i) => `url(#arrow-${i})`);
            
            // 绘制节点
            const nodeGroup = g.append('g').attr('class', 'nodes');
            
            const nodeElements = nodeGroup.selectAll('.node')
                .data(nodes)
                .enter()
                .append('g')
                .attr('class', 'node')
                .style('cursor', 'pointer')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
            // 外围色圈（角色标识色）
            nodeElements.append('circle')
                .attr('r', d => getNodeRadius(d.hotness) + 10)
                .attr('fill', 'none')
                .attr('stroke', (d) => identityColorMap[d.id]) // 使用映射获取颜色
                .attr('stroke-width', 6);
            
            // 节点圆形背景（无填充，只保留边框）
            nodeElements.append('circle')
                .attr('r', d => getNodeRadius(d.hotness))
                .attr('fill', 'none')
                .attr('stroke', '#fff')
                .attr('stroke-width', 2);
            
            // 头像
            nodeElements.append('text')
                .attr('text-anchor', 'middle')
                .attr('dy', '0.35em')
                .attr('font-size', d => {
                    const radius = getNodeRadius(d.hotness);
                    return radius * 0.8;
                })
                .text(d => d.avatar);
            
            // 用户名
            nodeElements.append('text')
                .attr('text-anchor', 'middle')
                .attr('dy', d => getNodeRadius(d.hotness) + 28)
                .attr('fill', 'white')
                .attr('font-size', '16px')
                .attr('font-weight', 'bold')
                .text(d => d.name);
            
            // 事件
            let clickTimeout;
            let clickDelay = 300; // 双击延迟阈值（毫秒）
            
            nodeElements
                .on('mouseover', showTooltip)
                .on('mousemove', moveTooltip)
                .on('mouseout', hideTooltip)
                .on('click', (e, d) => {
                    // 清除之前的单击计时器
                    if (clickTimeout) {
                        clearTimeout(clickTimeout);
                    }
                    
                    // 设置单击计时器
                    clickTimeout = setTimeout(() => {
                        // 单击：显示关联角色
                        filterToRelatedNodes(d.id);
                    }, clickDelay);
                })
                .on('dblclick', (e, d) => {
                    // 双击：跳转到角色主页
                    clearTimeout(clickTimeout); // 清除单击计时器
                    window.location.href = `/user-profile.html?id=${d.id}`;
                });
            
            // 更新连线位置
            function updateLinks() {
                linkElements.attr('d', d => {
                    const sourceId = typeof d.source === 'object' ? d.source.id : d.source;
                    const targetId = typeof d.target === 'object' ? d.target.id : d.target;
                    const sourceNode = nodes.find(n => n.id === sourceId);
                    const targetNode = nodes.find(n => n.id === targetId);
                    
                    if (!sourceNode || !targetNode) return '';
                    
                    const sourceRadius = getNodeRadius(sourceNode.hotness);
                    const targetRadius = getNodeRadius(targetNode.hotness);
                    
                    // 计算连线方向
                    const dx = targetNode.x - sourceNode.x;
                    const dy = targetNode.y - sourceNode.y;
                    const len = Math.sqrt(dx * dx + dy * dy);
                    
                    if (len === 0) return '';
                    
                    // 归一化方向向量
                    const dirX = dx / len;
                    const dirY = dy / len;
                    
                    // 计算起点和终点（从节点边缘开始）
                    const startX = sourceNode.x + dirX * sourceRadius;
                    const startY = sourceNode.y + dirY * sourceRadius;
                    const endX = targetNode.x - dirX * targetRadius;
                    const endY = targetNode.y - dirY * targetRadius;
                    
                    // 偏移（用于双向关系）
                    let offsetX = 0, offsetY = 0;
                    if (hasMutualLink(d)) {
                        const offset = 12;
                        // 偏移方向总是在箭头所指方向的右方（顺时针旋转90度）
                        // dx, dy是箭头方向，-dy, dx是向右的垂直方向
                        offsetX = -dy / len * offset;
                        offsetY = dx / len * offset;
                    }
                    
                    return `M${startX + offsetX},${startY + offsetY} ` +
                           `Q${(sourceNode.x + targetNode.x) / 2 + offsetX},${(sourceNode.y + targetNode.y) / 2 + offsetY} ` +
                           `${endX + offsetX},${endY + offsetY}`;
                });
                
                nodeElements.attr('transform', d => `translate(${d.x},${d.y})`);
            }
            
            // 初始更新
            updateLinks();
            
            // 拖拽时更新
            function dragstarted(event, d) {
                d.dragging = true;
            }
            
            function dragged(event, d) {
                d.x = event.x;
                d.y = event.y;
                updateLinks();
            }
            
            function dragended(event, d) {
                d.dragging = false;
                savePositions();
            }
        }
        
        // Tooltip
        function showTooltip(event, d) {
            const tooltip = document.getElementById('tooltip');
            const color = identityColorMap[d.id]; // 使用映射获取颜色
            
            tooltip.innerHTML = `
                <div class="tooltip-header">
                    <div class="tooltip-avatar" style="background: ${color};">${d.avatar}</div>
                    <div class="tooltip-name">${d.name}</div>
                </div>
                <div class="tooltip-stat">
                    <span>🔥 热力值</span>
                    <span class="tooltip-stat-value">${d.hotness}</span>
                </div>
                <div class="tooltip-stat">
                    <span>📝 24h发帖</span>
                    <span class="tooltip-stat-value">${d.posts_24h}</span>
                </div>
                <div class="tooltip-stat">
                    <span>💬 24h互动</span>
                    <span class="tooltip-stat-value">${d.interactions_24h}</span>
                </div>
            `;
            
            tooltip.style.display = 'block';
        }
        
        function moveTooltip(event) {
            const tooltip = document.getElementById('tooltip');
            tooltip.style.left = (event.pageX + 15) + 'px';
            tooltip.style.top = (event.pageY - 10) + 'px';
        }
        
        function hideTooltip() {
            document.getElementById('tooltip').style.display = 'none';
        }
        
        // 缩放控制
        function zoomIn() {
            svg.transition().duration(300).call(
                d3.zoom().transform, 
                zoomTransform.scale(1.3)
            );
        }
        
        function zoomOut() {
            svg.transition().duration(300).call(
                d3.zoom().transform, 
                zoomTransform.scale(0.7)
            );
        }
        
        function resetZoom() {
            svg.transition().duration(500).call(
                d3.zoom().transform, 
                d3.zoomIdentity
            );
        }
        
        // 获取与指定角色相关联的所有节点和链接
        function getRelatedNodesAndLinks(centerNodeId) {
            const relatedNodeIds = new Set([centerNodeId]);
            const relatedLinks = [];
            
            // 遍历所有链接，找到与中心角色相关的链接
            allLinks.forEach(link => {
                const sourceId = typeof link.source === 'object' ? link.source.id : link.source;
                const targetId = typeof link.target === 'object' ? link.target.id : link.target;
                
                if (sourceId === centerNodeId || targetId === centerNodeId) {
                    relatedNodeIds.add(sourceId);
                    relatedNodeIds.add(targetId);
                    relatedLinks.push(link);
                }
            });
            
            // 从所有节点中筛选出相关节点
            const relatedNodes = allNodes.filter(node => relatedNodeIds.has(node.id));
            
            return { nodes: relatedNodes, links: relatedLinks };
        }
        
        // 过滤显示与指定角色相关的图谱
        function filterToRelatedNodes(centerNodeId) {
            const { nodes: filteredNodes, links: filteredLinks } = getRelatedNodesAndLinks(centerNodeId);
            
            // 更新当前显示的节点和链接
            nodes = filteredNodes;
            links = filteredLinks;
            isFiltered = true;
            currentCenterNodeId = centerNodeId;
            
            // 显示返回按钮
            document.getElementById('back-btn-container').style.display = 'block';
            
            // 重新渲染
            reRenderGraph();
        }
        
        // 显示所有节点（返回全图谱）
        function showAllNodes() {
            // 恢复原始数据
            nodes = [...allNodes];
            links = [...allLinks];
            isFiltered = false;
            currentCenterNodeId = null;
            
            // 隐藏返回按钮
            document.getElementById('back-btn-container').style.display = 'none';
            
            // 重新渲染
            reRenderGraph();
        }
        
        // 重新渲染整个图谱
        function reRenderGraph() {
            // 清空当前图谱内容
            g.selectAll('*').remove();
            
            // 重新计算最大值
            maxHotness = Math.max(1, ...nodes.map(n => n.hotness || 0));
            maxInteractions = Math.max(1, ...links.map(e => e.interactions || e.interaction_count || 0));
            
            // 重新渲染
            render();
            
            // 调整视图到合适位置
            if (nodes.length > 0) {
                const bounds = {
                    minX: Math.min(...nodes.map(n => n.x)),
                    maxX: Math.max(...nodes.map(n => n.x)),
                    minY: Math.min(...nodes.map(n => n.y)),
                    maxY: Math.max(...nodes.map(n => n.y))
                };
                
                const container = document.getElementById('graph-container');
                const width = container.clientWidth;
                const height = container.clientHeight;
                
                const contentWidth = bounds.maxX - bounds.minX;
                const contentHeight = bounds.maxY - bounds.minY;
                const scale = Math.min(width / contentWidth, height / contentHeight) * 0.8;
                const centerX = (bounds.minX + bounds.maxX) / 2;
                const centerY = (bounds.minY + bounds.maxY) / 2;
                
                const initialTransform = d3.zoomIdentity
                    .translate(width / 2, height / 2)
                    .scale(scale)
                    .translate(-centerX, -centerY);
                
                svg.call(d3.zoom().transform, initialTransform);
            }
        }
        
        // 重新渲染图谱（用于更新热力值和尺寸）
        async function refreshGraph() {
            try {
                // 获取最新数据
                const response = await fetch(`${API_BASE_URL}/api/graph`);
                const data = await response.json();
                
                // 确保从 localStorage 读取最新的位置
                const savedPositions = localStorage.getItem('nodePositions');
                if (savedPositions) {
                    try {
                        nodePositions = JSON.parse(savedPositions);
                    } catch (e) {
                        console.error('解析保存的位置失败:', e);
                    }
                }
                
                // 更新节点数据（恢复保存的位置）
                data.nodes.forEach(newNode => {
                    const existingNode = nodes.find(n => n.id === newNode.id);
                    if (existingNode) {
                        existingNode.hotness = newNode.hotness;
                        existingNode.posts_24h = newNode.posts_24h;
                        existingNode.interactions_24h = newNode.interactions_24h;
                        
                        // 恢复保存的位置
                        if (nodePositions[existingNode.id]) {
                            existingNode.x = nodePositions[existingNode.id].x;
                            existingNode.y = nodePositions[existingNode.id].y;
                        }
                    }
                });
                
                // 重新计算最大值
                maxHotness = Math.max(1, ...nodes.map(n => n.hotness || 0));
                
                // 更新视觉元素
                const nodeGroup = d3.select('.nodes');
                const nodeElements = nodeGroup.selectAll('.node');
                
                // 更新外围色圈
                nodeElements.selectAll('circle:nth-child(1)')
                    .attr('r', d => getNodeRadius(d.hotness) + 10);
                
                // 更新节点背景
                nodeElements.selectAll('circle:nth-child(2)')
                    .attr('r', d => getNodeRadius(d.hotness));
                
                // 更新头像大小
                nodeElements.selectAll('text:nth-child(3)')
                    .attr('font-size', d => {
                        const radius = getNodeRadius(d.hotness);
                        return radius * 0.8;
                    });
                
                // 更新用户名位置
                nodeElements.selectAll('text:nth-child(4)')
                    .attr('dy', d => getNodeRadius(d.hotness) + 28);
                
                // 更新连线位置
                const linkGroup = d3.select('.links');
                const linkElements = linkGroup.selectAll('.link');
                
                // 更新连线粗细
                linkElements.attr('stroke-width', d => Math.max(3, d.interactions / 2));
                
                console.log('图谱数据已刷新');
            } catch (error) {
                console.error('刷新图谱数据失败:', error);
            }
        }
        
        // 启动
        document.addEventListener('DOMContentLoaded', () => {
            initGraph();
            
            // 每30秒自动刷新数据
            setInterval(refreshGraph, 30000);
        });
    </script>
</body>
