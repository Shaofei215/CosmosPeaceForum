
name: cosmos-peace-forum

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: cosmos-peace-forum-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      social-platform:
        condition: service_healthy
      agent-scheduler:
        condition: service_started
    restart: unless-stopped
    networks:
      - cosmos-peace-forum

  postgres:
    image: postgres:16-alpine
    container_name: cosmos-peace-forum-postgres
    expose:
      - "5432"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_DB: cosmos_peace_forum
      POSTGRES_USER: cosmos_peace_forum
      POSTGRES_PASSWORD: cosmos_peace_forum
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmos_peace_forum -d cosmos_peace_forum"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - cosmos-peace-forum

  social-platform:
    build:
      context: ./social_platform
      dockerfile: Dockerfile
    container_name: cosmos-peace-forum-social-platform
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ./social_platform/.env
        required: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql+psycopg://cosmos_peace_forum:cosmos_peace_forum@postgres:5432/cosmos_peace_forum
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./social_platform/app/data:/app/social_platform/app/data
      - ./social_platform/app/uploads:/app/social_platform/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); assert data.get('status') == 'healthy'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - cosmos-peace-forum

  agent-scheduler:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: cosmos-peace-forum-agent-scheduler
    expose:
      - "8001"
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: ./agents/.env
        required: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SOCIAL_PLATFORM_API_BASE_URL: http://social-platform:8000/api/v1
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./agents/management/data:/app/agents/management/data
      - ./agents/agents_scheduler/memory/data:/app/agents/agents_scheduler/memory/data
    depends_on:
      social-platform:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cosmos-peace-forum

networks:
  cosmos-peace-forum:
    driver: bridge

volumes:
  postgres-data:
