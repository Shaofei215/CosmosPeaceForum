# Herta-Tree Docker Compose 配置
# 开发环境使用此配置

services:
  # 后端服务
  backend:
    build:
      context: ./app_platform
      dockerfile: Dockerfile
    container_name: herta-backend
    ports:
      - "8000:8000"
    volumes:
      # 将整个 app_platform 挂载到 /app，保持与原来相同的目录结构
      - ./app_platform:/app
      # 数据持久化：将数据库文件挂载到宿主机，防止容器删除后数据丢失
      - ./data:/app/data
    env_file:
      # 从 app_platform/.env 加载环境变量
      - ./app_platform/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - herta-network

  # 前端服务 - 开发模式
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: herta-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      # 开发热重载
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      # 挂载配置文件确保更新生效
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/postcss.config.js:/app/postcss.config.js
      # 挂载 .env 文件确保配置更新
      - ./frontend/.env:/app/.env
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - herta-network
    profiles:
      - dev

  # 前端服务 - 生产模式
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: herta-frontend
    ports:
      - "80:80"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - herta-network
    profiles:
      - prod

networks:
  herta-network:
    driver: bridge

volumes:
  herta-data:
    driver: local
