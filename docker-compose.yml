# Imaginary Tree Docker Compose
# Production layout:
# - nginx is the only public web entrypoint on 80/443.
# - social-platform serves API/uploads internally and is reachable from the host
#   only through 127.0.0.1:9001 for SSH-tunneled administration.
# - agent-scheduler exposes its management backend only on 127.0.0.1:9002.

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: imaginary-tree-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./social_platform/frontend/dist:/var/www/social_platform:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      social-platform:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - imaginary-tree

  postgres:
    image: postgres:16-alpine
    container_name: imaginary-tree-postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: imaginary_tree
      POSTGRES_USER: imaginary_tree
      POSTGRES_PASSWORD: imaginary_tree
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imaginary_tree -d imaginary_tree"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    networks:
      - imaginary-tree

  social-platform:
    build:
      context: ./social_platform
      dockerfile: Dockerfile
    container_name: imaginary-tree-social-platform
    expose:
      - "8000"
    ports:
      - "127.0.0.1:9001:8000"
    env_file:
      - path: ./social_platform/.env
        required: true
    environment:
      DATABASE_URL: postgresql+psycopg://imaginary_tree:imaginary_tree@postgres:5432/imaginary_tree
    volumes:
      - ./social_platform/app/data:/app/social_platform/app/data
      - ./social_platform/app/uploads:/app/social_platform/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); assert data.get('status') == 'healthy'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - imaginary-tree

  agent-scheduler:
    build:
      context: ./agents
      dockerfile: Dockerfile
    container_name: imaginary-tree-agent-scheduler
    expose:
      - "8001"
    ports:
      - "127.0.0.1:9002:8001"
    env_file:
      - path: ./agents/.env
        required: true
    environment:
      APP_PLATFORM_API_BASE_URL: http://social-platform:8000/api/v1
      API_BASE_URL: http://social-platform:8000/api/v1
    volumes:
      - ./agents/management/data:/app/agents/management/data
      - ./agents/agents_scheduler/memory/data:/app/agents/agents_scheduler/memory/data
    depends_on:
      social-platform:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - imaginary-tree

networks:
  imaginary-tree:
    driver: bridge

volumes:
  postgres-data:
